# cargo-deny configuration (ADR-0007 dependency policy).
# Run: cargo deny check

[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# RUSTSEC-2026-0009 (`time` ≤0.3.45): stack exhaustion via deeply
# nested RFC 2822 comments. Not exposed — `time` reaches us only
# through `x509-parser`, which parses bounded UTCTime/GeneralizedTime
# fields, never attacker-controlled RFC 2822 strings. The fix
# (0.3.47) requires Rust 1.88, above our MSRV 1.85 — revisit when
# the MSRV moves.
#
# RUSTSEC-2024-0436 (`paste` 1.0.15 unmaintained): reaches us only via
# `netroute` → `netlink-packet-*` (latest releases) as a build-time
# proc-macro — no runtime code path, no advisory-worthy exposure.
# Revisit if `netroute` releases a `paste`-free version.
ignore = ["RUSTSEC-2026-0009", "RUSTSEC-2024-0436"]

[licenses]
# BSD-2-Clause project; allow the standard permissive set.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
# Highlight duplicates worth deduplicating but don't block yet.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
