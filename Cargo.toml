[workspace]
resolver = "3"
members = [
    "crates/bitdaemon",
    "crates/bitdaemon-bencode",
    "crates/bitdaemon-cli",
    "crates/bitdaemon-common",
    "crates/bitdaemon-core",
    "crates/bitdaemon-dht",
    "crates/bitdaemon-disk",
    "crates/bitdaemon-mmap",
    "crates/bitdaemon-net",
    "crates/bitdaemon-session",
    "crates/bitdaemon-sim",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
repository = "https://github.com/laurentgeynet-ux/BitDeamonRust"
homepage = "https://github.com/laurentgeynet-ux/BitDeamonRust"
description = "A BitTorrent client library ported from libtorrent (Rasterbar) to safe Rust"
keywords = ["bittorrent", "torrent", "p2p"]
categories = ["network-programming"]

[workspace.dependencies]
# internal crates
bitdaemon = { path = "crates/bitdaemon", version = "0.1.0" }
bitdaemon-common = { path = "crates/bitdaemon-common", version = "0.1.0" }
bitdaemon-bencode = { path = "crates/bitdaemon-bencode", version = "0.1.0" }
bitdaemon-core = { path = "crates/bitdaemon-core", version = "0.1.0" }
bitdaemon-disk = { path = "crates/bitdaemon-disk", version = "0.1.0" }
bitdaemon-mmap = { path = "crates/bitdaemon-mmap", version = "0.1.0" }
bitdaemon-net = { path = "crates/bitdaemon-net", version = "0.1.0" }
bitdaemon-dht = { path = "crates/bitdaemon-dht", version = "0.1.0" }
bitdaemon-session = { path = "crates/bitdaemon-session", version = "0.1.0" }

# external dependencies — pin minor versions, bump deliberately (see ADR-0007)
bytes = "1.5"
num-bigint = "0.4"
num-traits = "0.2"
thiserror = "2"
sha1 = "0.10"
ed25519-dalek = "2.1"
sha2 = "0.10"
crc32c = "0.6"
rand = "0.9"
bitvec = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
fs2 = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
memmap2 = "0.9"
# dev-only: Phase F benchmark harness (ADR-0007 note — dev dep, not shipped)
criterion = "0.5"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
if-addrs = "0.13"
netroute = "0.4"
# Win32 FFI for NTFS file controls (FSCTL_SET_SPARSE, SetFileValidData)
# — confined to bitdaemon-disk::file::win32, see ADR-0022.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
] }
rustls = "0.23"
tokio-rustls = "0.26"
# HTTPS trackers need the OS root store (upstream reads the system
# trust DB) — `rustls-native-certs`, ADR-0007 note.
rustls-native-certs = "0.8"
rustls-webpki = "0.103"
x509-parser = "0.16"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
